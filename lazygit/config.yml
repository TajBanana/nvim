# lazygit config (Space lg) -- the single source of truth.
#
# lazygit.nvim passes this file explicitly (-ucf, see lua/plugins/git.lua), so
# <leader>lg uses it on every OS with no setup. For terminal `lazygit` too, link
# it into lazygit's per-OS config dir (macOS reads ~/Library/Application
# Support/lazygit, Linux/WSL ~/.config/lazygit) -- see the readme's Symlinks.

gui:
  # The same palette as Neovim (lua/plugins/colorscheme.lua), so lazygit's chrome
  # matches the editor and its git gutter: blue = GitSignsChange, green =
  # GitSignsAdd, red = GitSignsDelete, backgrounds = the overridden bg1/bg3.
  # (The live macOS file this was rebuilt from on 2026-09-28 used stock Material
  # accents and onedark "deep" backgrounds instead; these restore the colours
  # this repo file had on main.)
  theme:
    activeBorderColor:
      - '#9CC2FF' # GitSignsChange blue -- focused panel border
      - bold
    inactiveBorderColor:
      - '#5c6370' # unfocused panel borders recede
    optionsTextColor:
      - '#9CC2FF' # GitSignsChange blue -- keybinding hints
    selectedLineBgColor:
      - '#1c1e23' # bg1 -- cursor line / selection (nvim cursorline)
    cherryPickedCommitBgColor:
      - '#2f352b' # the gutter add colour blended into the editor background
    cherryPickedCommitFgColor:
      - '#D5F58F' # GitSignsAdd green
    markedBaseCommitBgColor:
      - '#23252c' # bg3
    markedBaseCommitFgColor:
      - '#FFCB6B' # md_yellow
    unstagedChangesColor:
      - '#FF8A91' # GitSignsDelete red
    defaultFgColor:
      - '#EEFFFF' # md_white -- default text
    searchingActiveBorderColor:
      - '#FFCB6B' # md_yellow
  authorColors:
    '*': '#C792EA' # md_purple
  # Side-by-side diffs need horizontal room. `+` cycles panel zoom at runtime;
  # this just makes the default split favour the diff panel over the file list.
  mainPanelSplitMode: horizontal
  sidePanelWidth: 0.25
  showFileTree: true
  nerdFontsVersion: "3"

git:
  diffRenderers:
    - colorArg: always
      # --paging=never: lazygit is already the pager, and letting delta start
      # another one deadlocks the diff panel. --dark: delta cannot query the
      # terminal background from inside lazygit (lazygit's documented delta
      # setup passes it). Side-by-side, line numbers and the theme are explicit
      # so the diff looks the same on a machine without the git/delta.gitconfig
      # include; with it, that file's Material Darker colours apply on top.
      # --width=variable: delta stops padding line backgrounds out to a fixed
      # width. (Restored 2026-09-29 from main, whose comment said it made the
      # side-by-side split follow the panel on resize/zoom; measured in a pty at
      # 60 and 120 columns the split is identical with and without it -- so it
      # is cosmetic, and harmless.)
      # (Older lazygit releases took this as git.paging.pager instead.)
      command: delta --dark --paging=never --side-by-side --width=variable --line-numbers --syntax-theme=TwoDark

os:
  # `e` on a file opens it in the Neovim that launched lazygit (<leader>lg),
  # not a nested editor inside the floating window.
  editPreset: nvim-remote
